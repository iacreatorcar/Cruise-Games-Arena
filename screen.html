<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Display - Cruise Games Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        .display-container { max-width: 1400px; margin: 0 auto; padding: 40px; }
        .game-status-banner { background: #e74c3c; padding: 15px; text-align: center; font-size: 24px; border-radius: 15px; margin-bottom: 20px; }
        .lang-toggle { position: fixed; top: 20px; right: 20px; background: #2d3748; padding: 10px 15px; border-radius: 10px; z-index: 100; }
        .lang-toggle select { background: #667eea; color: white; padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; }
        .question-section { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 40px; padding: 50px; margin-bottom: 30px; text-align: center; }
        .question-number { font-size: 24px; opacity: 0.9; margin-bottom: 20px; }
        .question-text { font-size: 48px; font-weight: bold; margin-bottom: 40px; line-height: 1.3; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .option-display { background: rgba(255,255,255,0.15); padding: 25px; border-radius: 20px; font-size: 28px; font-weight: bold; text-align: center; }
        .option-letter { display: inline-block; width: 50px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 50%; line-height: 50px; margin-right: 15px; }
        .stats-section { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 20px 30px; border-radius: 20px; text-align: center; flex: 1; }
        .stat-number { font-size: 48px; font-weight: bold; color: #f1c40f; }
        .ranking-section { background: rgba(255,255,255,0.05); border-radius: 30px; padding: 20px; margin-top: 30px; }
        .ranking-title { font-size: 28px; margin-bottom: 20px; text-align: center; }
        .ranking-table { width: 100%; border-collapse: collapse; }
        .ranking-table th, .ranking-table td { padding: 12px; text-align: left; font-size: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .rank-1 { background: rgba(255,215,0,0.2); }
        .rank-2 { background: rgba(192,192,192,0.2); }
        .rank-3 { background: rgba(205,127,50,0.2); }
        .score { color: #f1c40f; font-weight: bold; }
        .final-podium { background: linear-gradient(135deg, #2d3748 0%, #1a1a2e 100%); border-radius: 40px; padding: 40px; margin-top: 30px; text-align: center; }
        .podium-winners { display: flex; justify-content: center; align-items: flex-end; gap: 30px; flex-wrap: wrap; margin-top: 30px; }
        .winner-card { text-align: center; padding: 30px; border-radius: 20px; min-width: 250px; }
        .winner-1 { background: linear-gradient(135deg, #ffd700, #ffb347); transform: scale(1.05); }
        .winner-2 { background: linear-gradient(135deg, #c0c0c0, #a9a9a9); }
        .winner-3 { background: linear-gradient(135deg, #cd7f32, #b87333); }
        .winner-name { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .presenter-controls { position: fixed; bottom: 20px; right: 20px; background: #2d3748; padding: 15px; border-radius: 15px; display: flex; gap: 10px; z-index: 100; }
        .presenter-controls button { background: #48bb78; color: white; padding: 12px 24px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
        @media (max-width: 768px) { .question-text { font-size: 28px; } .option-display { font-size: 18px; padding: 15px; } .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>

    </div>
